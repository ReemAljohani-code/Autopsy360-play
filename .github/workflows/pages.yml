name: Publish Autopsy360

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website package
        uses: actions/checkout@v6
      - name: Verify and unpack the website
        run: |
          sha256sum --check website.zip.sha256
          python3 -m zipfile -e website.zip _site
          test -f _site/index.html
          test -f _site/models/brain/brain.glb
          test -f _site/models/heart-source/heart.glb
          test -f _site/models/cervicothoracic/block.meshopt.glb
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
